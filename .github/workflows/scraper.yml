name: Cloud Search Scraper

on:
  schedule:
    # Führt das Skript automatisch alle 6 Stunden aus (völlig kostenlos)
    - cron: '0 */6 * * *'
  workflow_dispatch: # Erlaubt es dir, den Scraper jederzeit manuell per Klick zu starten

jobs:
  run-scraper:
    runs-on: ubuntu-latest

    steps:
    - name: Code auschecken
      uses: actions/checkout@v4

    - name: Python installieren
      uses: actions/setup-python@v5
      with:
        python-node-version: '3.11'

    - name: Abhängigkeiten installieren
      run: |
        python -m pip install --upgrade pip
        pip install requests beautifulsoup4 qdrant-client

    - name: Scraper ausführen
      env:
        # Hier verknüpfen wir die geheimen Zugangsdaten aus GitHub mit dem Skript
        QDRANT_URL: ${{ secrets.QDRANT_URL }}
        QDRANT_API_KEY: ${{ secrets.QDRANT_API_KEY }}
      run: python crawler.py
